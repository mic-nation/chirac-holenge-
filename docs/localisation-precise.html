<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Localisation Précise</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <div class="menu-toggle">☰</div>

    <ul class="menu">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>

</nav>

<section class="geo-banner geo-banner-localisation">

    <div class="geo-banner-content">

        <h1>Localisation Précise</h1>

        <p>
            Identification précise des coordonnées du site
            pour garantir la réussite de votre projet de forage.
        </p>

    </div>

</section>

<h2 class="forage-title">
    Demande de Localisation Précise
</h2>

<p class="forage-text">
    Complétez cette fiche afin de permettre une localisation
    précise de votre futur point de forage.
</p>

<section class="geo-form-section">

<form action="https://formspree.io/f/mvzplaad" method="POST">

    <input type="text" name="Nom" placeholder="Nom" required>

    <input type="text" name="Post-nom" placeholder="Post-nom" required>

    <input type="tel" name="Téléphone" placeholder="Téléphone" required>

    <input type="text" name="Village" placeholder="Village / Quartier">

    <input type="text" name="Commune" placeholder="Commune">

    <input type="text" name="Territoire" placeholder="Territoire">

    <input type="text" name="Province" placeholder="Province">

    <input type="text" name="Repère" placeholder="Repère principal du site">

    <textarea
    name="Description"
    rows="6"
    placeholder="Décrivez l'emplacement exact du terrain...">
    </textarea>

    <button type="submit">
        📍 Envoyer ma demande
    </button>

</form>

</section>

<script src="menu.js"></script>

</body>

      </html>
